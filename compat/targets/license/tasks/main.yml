---
# The collection ships no test for the license module. These tasks expect
# what an upstream AWX without a subscription answers (its OpenLicense): a
# manifest is refused with a 400, which the module does not report.
- name: Remove the license
  license:
    state: absent
  register: result

- assert:
    that:
      - result is not failed
      - result is not changed

- name: Write a file that is no subscription manifest
  tempfile:
    suffix: .zip
  register: manifest

- copy:
    dest: "{{ manifest.path }}"
    content: "not a manifest"

- name: Install it
  license:
    manifest: "{{ manifest.path }}"
  register: result

- assert:
    that:
      - result is not failed
      - result is changed

- name: Check mode
  license:
    manifest: "{{ manifest.path }}"
  check_mode: true
  register: result

- assert:
    that:
      - result is changed

- file:
    path: "{{ manifest.path }}"
    state: absent
