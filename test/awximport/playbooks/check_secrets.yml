---
# The template `check-secrets`, run on AWX before the import and on awxnext
# after it (.github/workflows/import-awx.yml). It passes only if the imported
# credential's secrets, the survey's encrypted default and the variables of the
# inventory, group and host reach the job. test/awximport/awximport.py sets
# these values.
- name: What was stored in AWX reaches the job
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The credential's secrets, through its environment and file injectors
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'IMPORT_CHECK_TOKEN') == 'token é€ from awx'
          - lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'IMPORT_CHECK_FILE')) == 'line one\nline two'
          - import_check_plain == 'plain from awx'

    - name: The survey's encrypted default
      ansible.builtin.assert:
        that:
          - survey_secret == 'survey secret from awx'
          - colour == 'blue'

    - name: The variables of the template, the inventory, its group and the host
      ansible.builtin.assert:
        that:
          - from_template == 'template var'
          - from_inventory == 'inventory var'
          - from_group == 'group var'
          - from_host == 'host var'
