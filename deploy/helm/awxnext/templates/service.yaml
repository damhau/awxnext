apiVersion: v1
kind: Service
metadata:
  name: {{ include "awxnext.fullname" . }}
  labels: {{- include "awxnext.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "awxnext.selector" . | nindent 4 }}
    app.kubernetes.io/component: control
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
