{{- /* Generated once and kept across upgrades. */ -}}
{{- $name := include "awxnext.secret" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $key := index $old "secret-key" | default "" | b64dec | default (randAlphaNum 48) -}}
{{- $admin := index $old "admin-password" | default "" | b64dec | default (randAlphaNum 20) -}}
{{- $db := index $old "database-password" | default "" | b64dec | default (randAlphaNum 24) -}}
{{- if or (not .Values.secretKey.existingSecret) (not .Values.admin.existingSecret) .Values.postgresql.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "awxnext.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.secretKey.existingSecret }}
  secret-key: {{ $key | quote }}
  {{- end }}
  {{- if not .Values.admin.existingSecret }}
  admin-password: {{ $admin | quote }}
  {{- end }}
  {{- if .Values.postgresql.bundled }}
  database-password: {{ $db | quote }}
  database-url: {{ printf "postgres://awxnext:%s@%s-postgresql:5432/awxnext?sslmode=disable" $db (include "awxnext.fullname" .) | quote }}
  {{- end }}
{{- end }}
