# awxnext on Kubernetes. Values not set here keep awxnext's defaults
# (README, "Configuration").

image:
  # The all-in-one image: project syncs need its git, and jobs on the
  # control plane its ansible-runner.
  repository: ghcr.io/damhau/awxnext-all-in-one
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# API and control plane replicas. Each registers itself as an instance (its
# pod name) and runs jobs; jobs in container groups run in their own pods.
replicaCount: 1
# Each rollout replaces the pods, whose names never come back: an instance
# whose pod has been silent for 2 minutes is deleted (once its jobs are
# failed) instead of staying listed as unavailable.
# AWXNEXT_AUTO_DEPROVISION_INSTANCES.
autoDeprovisionInstances: true

# Argo CD and Flux render the chart with `helm template`, where the lookup
# that keeps generated secrets across upgrades finds nothing: each render
# would generate new ones. With them, set admin.existingSecret and
# secretKey.existingSecret (and use an external PostgreSQL), and turn off
# migrations below.

admin:
  # The superuser created and kept at each start, with the password in an
  # existing secret (key "password") or generated (shown by the NOTES).
  username: admin
  existingSecret: ""

# The master key that wraps the data keys of secrets. Keep it: without it
# (or a key escrow, `awxnext keys export`), secrets cannot be read.
secretKey:
  # An existing secret with the key under "secret-key"; empty: one is
  # generated at install and kept across upgrades.
  existingSecret: ""

# PostgreSQL: bundled (a single-replica StatefulSet, for trying awxnext out
# and small installs) or external.
postgresql:
  bundled: true
  image: postgres:16
  storage: 8Gi
  storageClass: ""
  # The image's postgres user (uid 999), who already owns the data of
  # installs whose entrypoint started as root (chart versions before these
  # values). OnRootMismatch: the volume's group is set once, not at each start.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # External: a secret holding the connection URL
  # (postgres://user:password@host:5432/awxnext?sslmode=require), under
  # "key". For a CloudNativePG cluster, its <cluster>-app secret, key "uri".
  external:
    existingSecret: ""
    key: url

# How jobs run on the control plane replicas: none (ansible-runner in the
# image), podman or docker. Container groups run jobs in pods instead.
containerRuntime: none
# The execution environment of templates that name none.
defaultExecutionEnvironment: quay.io/ansible/awx-ee:latest

persistence:
  # Project checkouts and job directories. Without a claim they live in the
  # pod (emptyDir); with several replicas each keeps its own.
  existingClaim: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: awxnext.example.com
  tls: []
  #  - secretName: awxnext-tls
  #    hosts: [awxnext.example.com]

service:
  type: ClusterIP
  port: 8052

# The service account of the control plane pods, which container groups
# without a Kubernetes credential use to create job pods in this namespace.
serviceAccount:
  create: true
  name: ""
containerGroups:
  # The Role letting the service account create and delete job pods.
  rbac: true

# On Kubernetes, the hub reads each collection version's module docs with
# ansible-doc in a pod of the organization's execution environment, created
# with the Role above (HUB_COLLECTION_DOCS). ansible-doc runs some of the
# collection's code, so this NetworkPolicy lets those pods reach only this
# release's control pods and DNS. It holds only where the cluster's network
# plugin enforces NetworkPolicy.
collectionDocs:
  networkPolicy:
    enabled: true
    # The cluster's DNS pods, which the docs pods ask for the control pods'
    # service.
    dns:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns

# A remote execution node: an agent dialing back to the control plane, with
# the token of its instance (`POST /api/v2/instances/N/agent_token/`).
agent:
  enabled: false
  url: ""
  tokenSecret: ""
  runtime: none
  # Requests only: its capacity comes from the node it runs on, whatever its
  # limits, so a memory limit below the node's can get its jobs killed.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# Run the migrations as a Job before an upgrade rolls the replicas. Off under
# Argo CD: it runs the hook before every sync, the first one included, when
# the database does not exist yet. The replicas migrate as they start instead,
# one at a time under a lock.
migrations:
  enabled: true

env: []

# The awxnext pods (replicas, migration Job, agent): the image's user, no
# privileges, a read-only root file system (/tmp is an emptyDir). The chart's
# volumes keep jobs from running as job users (docs/operations.md), so the job
# helper's capabilities are not needed. The podman and docker runtimes
# (containerRuntime, agent.runtime) need more: override securityContext.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The replicas and the migration Job. Jobs without a container group run in
# the replicas, whose capacity (forks) comes from these limits
# (SYSTEM_TASK_ABS_CPU and SYSTEM_TASK_ABS_MEM), not from the node's.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
nodeSelector: {}
tolerations: []
affinity: {}
