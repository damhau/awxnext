# Small install / local testing: PostgreSQL + AWX Next (all-in-one image,
# jobs run inside the awxnext container with ansible-runner).
#
#   AWXNEXT_ADMIN_PASSWORD=<password> docker compose up -d --build
#   open http://localhost:8052 (user admin)
#
# Demo content (organizations, templates, a workflow, some finished jobs):
#   docker compose exec awxnext seed-demo --jobs
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: awxnext
      POSTGRES_USER: awxnext
      POSTGRES_PASSWORD: awxnext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awxnext"]
      interval: 5s
      retries: 10

  awxnext:
    build:
      context: ../..
      target: all-in-one
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWXNEXT_DATABASE_URL: postgres://awxnext:awxnext@postgres:5432/awxnext?sslmode=disable
      # Change this! Losing it makes stored credentials unreadable (see 'awxnext keys export').
      AWXNEXT_SECRET_KEY: ${AWXNEXT_SECRET_KEY:-change-me}
      AWXNEXT_BASE_URL: ${AWXNEXT_BASE_URL:-http://localhost:8052}
      # Creates (or resets) the admin user at each start when set.
      AWXNEXT_ADMIN_PASSWORD: ${AWXNEXT_ADMIN_PASSWORD:-}
    volumes:
      - awxdata:/var/lib/awxnext
    ports:
      - "8052:8052"
    # Lets jobs target the machine running Docker as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  awxdata:
