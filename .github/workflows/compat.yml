name: Compatibility

# AWX's own clients against awxnext (compat/run.py): the awx.awx collection's
# integration targets, the awx CLI and the Terraform provider. From full.yml
# (nightly, a job per suite) and on demand; the report is attached to the run
# and shown in its summary.
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      suite:
        description: "collection, cli or terraform (empty: all)"
        required: false
        default: ""

# The GITHUB_TOKEN reads the repository, nothing more, unless a job asks.
permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Terraform provider's acceptance tests are Go tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: start a throwaway awxnext
        run: docker compose -f compat/docker-compose.yml up -d --build --wait
      - name: run the suites
        run: uv run --script compat/run.py ${{ inputs.suite && format('--suite {0}', inputs.suite) || '' }}
      - name: server log
        if: always()
        run: docker compose -f compat/docker-compose.yml logs --no-color awxnext > compat-report/awxnext.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compat-report${{ inputs.suite && format('-{0}', inputs.suite) || '' }}
          path: compat-report
