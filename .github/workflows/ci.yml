name: CI

# On pushes to main and on PRs (Dependabot's among them: a PR runs it once,
# not again for the push to its branch).
#
# A push to main that changes only documentation, .gitignore or LICENSE does
# not run it: nothing builds or tests them, except docs/configuration.md,
# which a test compares with the settings it is generated from.
#
# Every PR runs it, whatever it changes, docs included: the owner merges a PR
# on its result, so each one gets one.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.gitignore'
      - '!LICENSE'
      - 'docs/configuration.md'
  pull_request:

# The GITHUB_TOKEN reads the repository, nothing more, unless a job asks.
permissions:
  contents: read

jobs:
  # The short suite (go test -short, no race detector): what each change
  # needs. full.yml runs everything nightly and before a milestone closes.
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWXNEXT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -short -count=1 ./...
      - name: build
        run: go build -o bin/awxnext ./cmd/awxnext

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit -p .
      - name: unit tests
        run: npx vitest run
      - name: build
        run: npm run build

  # Every action pinned to a commit (make pinned-actions).
  actions:
    name: Actions pinned to commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make pinned-actions

  # On main, once the tests pass: the all-in-one image, tagged
  # main-<commit time, UTC, YYYYMMDDHHMMSS>-<commit>, which sorts by date, and
  # main. Argo CD Image Updater follows the dated tags into the GitOps repo
  # (docs/operations.md, "With Argo CD or Flux"). Then the chart, as
  # oci://ghcr.io/<owner>/charts/awxnext version <Chart.yaml's>-main.<commit
  # time>, a pre-release of the next release, with that image as its default.
  image:
    needs: [go, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag
        id: tag
        run: |
          stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "tag=main-$stamp-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: all-in-one
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILT=${{ steps.tag.outputs.built }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/awxnext-all-in-one:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/awxnext-all-in-one:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          STAMP: ${{ steps.tag.outputs.stamp }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="$(sed -n 's/^version: *//p' deploy/helm/awxnext/Chart.yaml)-main.$STAMP"
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/awxnext --version "$version" --app-version "$TAG"
          helm push "awxnext-$version.tgz" "oci://ghcr.io/$owner/charts"
