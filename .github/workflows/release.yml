# On a version tag (v1.2.3): the images on ghcr.io, and the Helm chart as an
# OCI artifact (oci://ghcr.io/<owner>/charts/awxnext).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: images
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          stamp=(--build-arg "VERSION=$version" --build-arg "COMMIT=$GITHUB_SHA" --build-arg "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          docker build "${stamp[@]}" -t "ghcr.io/$owner/awxnext:$version" -t "ghcr.io/$owner/awxnext:latest" .
          docker build "${stamp[@]}" --target all-in-one -t "ghcr.io/$owner/awxnext-all-in-one:$version" -t "ghcr.io/$owner/awxnext-all-in-one:latest" .
          for image in awxnext awxnext-all-in-one; do
            docker push "ghcr.io/$owner/$image:$version"
            docker push "ghcr.io/$owner/$image:latest"
          done
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/awxnext --version "$version" --app-version "$version"
          helm push "awxnext-$version.tgz" "oci://ghcr.io/$owner/charts"
