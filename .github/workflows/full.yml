name: Full

# Everything: the whole Go suite with the race detector (job tests, object
# storage against MinIO and Azurite, event connectors with ansible.eda and
# its Kafka source against Kafka, imported rulebooks against ansible-rulebook
# itself), the chart (helm.yml), the image with
# Compose (compose.yml), the importer against a real AWX (import-awx.yml)
# and AWX's clients (compat.yml, a job per suite). Nightly, and by hand before
# a milestone is closed: gh workflow run full.yml
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# The GITHUB_TOKEN reads the repository, nothing more, unless a job asks.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWXNEXT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      AWXNEXT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWXNEXT_TEST_S3_ACCESS_KEY: awxnext
      AWXNEXT_TEST_S3_SECRET_KEY: awxnext-test-secret
      AWXNEXT_TEST_AZURITE_BLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      # A real execution environment's contents, read from its registry.
      AWXNEXT_TEST_EE_IMAGE: quay.io/ansible/awx-ee:24.6.1
      AWXNEXT_TEST_KAFKA_BOOTSTRAP: localhost:9092
      # The differential test of imported rulebooks runs this command.
      AWXNEXT_TEST_ANSIBLE_RULEBOOK: ansible-rulebook
      # A collection remote mirrors community.docker from galaxy.ansible.com.
      AWXNEXT_TEST_GALAXY_REMOTE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without ansible-runner on the PATH the job tests skip themselves.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: ansible for the job tests
        run: pip install ansible-core==2.19.14 ansible-runner==2.4.3
      # ansible.eda's sources for the event connector tests, with what its
      # range, generic and kafka sources import.
      - name: ansible.eda for the connector tests
        run: |
          pip install pyyaml==6.0.3 aiokafka==0.15.0 aiohttp==3.14.5 fastavro==1.13.1
          ansible-galaxy collection install ansible.eda:==2.13.0 -p ~/.cache/awxnext/collections
      # ansible-rulebook runs its rules in Drools, on a JVM of Java 17 or later.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: ansible-rulebook for the rulebook differential test
        run: pip install ansible-rulebook==1.3.2 dpath==2.2.0
      # pg_dump and pg_restore for the backup test: the runner's own, which
      # dump the postgres:16 service as long as they're 16 or newer.
      - name: PostgreSQL client tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -ge 16
      # Object storage for the job event archive tests: MinIO (the pgsty/minio
      # community fork; MinIO publishes no builds) and Azurite; a Kafka broker
      # for the connectors' Kafka source. Services cannot be given a command.
      - name: MinIO, Azurite and Kafka
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=awxnext -e MINIO_ROOT_PASSWORD=awxnext-test-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.36.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          docker run -d --name kafka -p 9092:9092 apache/kafka:4.4.0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          for i in $(seq 1 60); do docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list && break; sleep 1; done
      - name: test
        # ./test/ takes 7 to 10 minutes with -race: past go test's default
        # -timeout of 10m (the nightly run of 2026-11-02 stopped at 601 s).
        run: go test -race -count=1 -timeout 30m ./...
      # Again with -v: its log shows that ansible.eda's sources and Kafka
      # ran. With AWXNEXT_TEST_KAFKA_BOOTSTRAP set they fail, not skip, when
      # a piece is missing.
      - name: ansible.eda and Kafka connector tests, verbose
        run: go test -count=1 -run 'TestEventConnector(EDA|Kafka)' -v ./test/
      # Its log shows ansible-rulebook's outcome and awxnext's. With
      # AWXNEXT_TEST_ANSIBLE_RULEBOOK set it fails, not skips, when
      # ansible-rulebook or Java is missing.
      - name: rulebook differential test against ansible-rulebook, verbose
        run: go test -count=1 -run 'TestRulebookAlertmanagerDifferential' -v ./test/
      # Its log shows the sync's output. With AWXNEXT_TEST_GALAXY_REMOTE set
      # it fails, not skips, when galaxy.ansible.com can't be reached.
      - name: collection remote of galaxy.ansible.com, verbose
        run: go test -count=1 -run 'TestHubRemoteGalaxyAnsibleCom' -v ./test/

  helm:
    uses: ./.github/workflows/helm.yml

  compose:
    uses: ./.github/workflows/compose.yml

  import-awx:
    uses: ./.github/workflows/import-awx.yml

  compat:
    strategy:
      fail-fast: false
      matrix:
        suite: [collection, cli, terraform, eda]
    uses: ./.github/workflows/compat.yml
    with:
      suite: ${{ matrix.suite }}
