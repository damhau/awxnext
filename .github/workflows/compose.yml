name: Compose

# The all-in-one image with Compose (deploy/compose): jobs run as job users of
# their own (internal/jobexec), tested by test/isolation. On pushes to main and
# PRs that change the image, the Compose file or the job helper, and from
# full.yml. helm.yml tests the chart.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - deploy/docker-entrypoint.sh
      - deploy/compose/**
      - internal/jobexec/**
      - cmd/awxnext-jobexec/**
      - test/isolation/**
      - .github/workflows/compose.yml
  pull_request:
    paths:
      - Dockerfile
      - deploy/docker-entrypoint.sh
      - deploy/compose/**
      - internal/jobexec/**
      - cmd/awxnext-jobexec/**
      - test/isolation/**
      - .github/workflows/compose.yml
  workflow_call:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: start
        working-directory: deploy/compose
        env:
          AWXNEXT_SECRET_KEY: ci-compose-secret-key
          AWXNEXT_DB_PASSWORD: cicompose
          AWXNEXT_ADMIN_PASSWORD: ci-compose-admin
        run: docker compose up -d --build --wait
      - name: jobs as job users
        run: |
          docker compose -f deploy/compose/docker-compose.yml logs awxnext | grep "jobs run as job users"
          export AWXNEXT_TEST_ISOLATION_URL=http://127.0.0.1:8052 AWXNEXT_TEST_ISOLATION_PASSWORD=ci-compose-admin
          go test -count=1 -v ./test/isolation/
      - name: diagnostics
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail 300 || true

